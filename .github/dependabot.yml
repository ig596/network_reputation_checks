version: 2

multi-ecosystem-groups:
  python:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: python
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ["*"]
