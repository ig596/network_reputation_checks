name: CI

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  commit-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only validate PRs, not automated commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check signed commits in PR
        uses: 1Password/check-signed-commits-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [commit-validation]
    if: always() && (needs.commit-validation.result == 'success' || github.event_name == 'push')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --with dev
      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=network_reputation_check --cov-report=xml --cov-report=term
      - name: Generate coverage badge
        run: |
          poetry run genbadge coverage -i coverage.xml -o coverage.svg
      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage.svg

  lint:
    runs-on: ubuntu-latest
    needs: [commit-validation]
    if: always() && (needs.commit-validation.result == 'success' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --with dev
      - name: Run pre-commit hooks
        run: |
          poetry run pre-commit run --all-files


  validate-docker:
    permissions:
      contents: read  # Restrict permissions to read-only
    runs-on: ubuntu-latest
    needs: [commit-validation]
    if: always() && (needs.commit-validation.result == 'success' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate build configuration
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: true
        with:
          call: check
