name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-validation:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check signed commits in PR
        uses: 1Password/check-signed-commits-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [commit-validation]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --with dev
      - name: Run tests with coverage
        run: poetry run pytest --cov=network_reputation_check --cov-report=xml --cov-report=term
      - name: Generate coverage badge
        run: poetry run genbadge coverage -i coverage.xml -o coverage.svg
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.svg
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    needs: [commit-validation]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --with dev
      - name: Run pre-commit hooks
        run: poetry run pre-commit run --all-files

  validate-docker:
    permissions:
      contents: read  # Restrict permissions to read-only
    runs-on: ubuntu-latest
    needs: [commit-validation]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate build configuration
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: true
        with:
          call: check
      - name: Build action for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: network-reputation-check:smoke
      - name: Smoke test Docker action inputs and workspace outputs
        run: |
          fixture_dir="$(mktemp -d)"
          mkdir "$fixture_dir/empty"
          docker run --rm --workdir /github/workspace \
            --mount "type=bind,source=$fixture_dir,target=/github/workspace" \
            --env NRC_SOURCE=virustotal --env NRC_API_KEY=unused \
            --env NRC_SCAN_PATH=empty --env NRC_SARIF_FILE=results.sarif \
            --env NRC_OUTPUT_FILE=results.json \
            network-reputation-check:smoke
          test -s "$fixture_dir/results.sarif"
          test "$(cat "$fixture_dir/results.json")" = '[]'
